<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    table {
      border-collapse: collapse;
      width: 600px;
    }

    td {
      border: 2px solid rgb(14, 11, 11);
      text-align: left;
      padding: 10px;
    }
    th {
      border: 2px solid black;
      color: white;
      padding: 10px;
      background-color: gray;
    }
    .num{
      text-align: center;
    }
    .sub{
    background-color: gray;
    text-align: center;
    color: white;
    }
    .subee{
    background-color: gray;
    text-align: left;
    color: white;
    }
    .materia{
      text-align:center;
    }
  
  </style>
</head>
<body>
  <table>
    <tr>
     <th rowspan="2">Área</th>
     <th rowspan="2">Disciplinas</th>
     <th colspan="2">Notas</th>
     <th rowspan="2">Média</th>
     </tr>
       <td class="sub"><strong>Nota 1</strong></td>
       <td class="sub"><strong>Nota 2</strong></td>          
    <tbody>
      <tr>
        <td rowspan="5" class="materia"><strong>Exatas</strong></td>
      </tr>
      <tr>
        <td>Matemática</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
      <tr>
        <td>Fisica</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
        <tr>
        <td>Quimica</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
        <tr>
        <td>Biologia</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
      <tr>
        <td colspan="4" class="subee"><strong>Médias de Exatas</strong></td>
        <td class="sub">0.0</td>
      </tr>
       <tr>
        <td rowspan="2" class="materia"><strong>Humanas</strong></td>
        <td>História</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
      <tr>
         <td>Geografia</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
        <td class="num">0.0</td>
      </tr>
       <tr>
        <td colspan="4" class="subee"><strong>Médias de Humanas</strong></td>
        <td class="sub">0.0</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
